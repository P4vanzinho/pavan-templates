<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f1e9">
  <meta name="description" content="Lume — fotografia para guardar o que importa. Um template de fotografia autoral com portfólio, ensaios e galeria do cliente.">
  <title>Lume — A vida passa. A imagem fica.</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/pages.css">
</head>
<body>
  <header class="header container">
    <a class="brand" href="/" data-link data-home-logo aria-label="Lume, início"><span class="brand-mark" aria-hidden="true"></span><span class="brand-word">LUME</span></a>
    <nav class="header-nav" aria-label="Navegação principal">
      <a href="/portfolio" data-link>Portfólio</a>
      <a href="/sobre" data-link>Meu olhar</a>
    </nav>
    <div class="header-actions">
      <a class="client-link" href="/galeria" data-link>Galeria do cliente ↗</a>
      <a class="button button--dark header-cta" href="#contato" data-contact>Contato <span aria-hidden="true">↗</span></a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu" aria-haspopup="dialog" aria-controls="menu-dialog"><span></span><span></span></button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <div id="footer-slot"></div>
  <noscript><p class="container">Ative o JavaScript no navegador para explorar este template de fotografia.</p></noscript>
  <div id="custom-cursor" class="custom-cursor" aria-hidden="true"></div>
  <div id="route-curtain" class="route-curtain" aria-hidden="true"><img src="/assets/images/vento.webp" alt=""><span class="curtain-brand">LUME</span></div>
  <dialog id="menu-dialog" class="mobile-menu" aria-label="Menu de navegação">
    <div class="menu-top"><a class="brand" href="/" data-link data-home-logo aria-label="Lume, início"><span class="brand-mark" aria-hidden="true"></span><span class="brand-word">LUME</span></a><button class="menu-close" data-action="close-menu" aria-label="Fechar menu">×</button></div>
    <nav class="menu-links" aria-label="Navegação móvel">
      <a href="/" data-link>Início <span aria-hidden="true">↗</span></a>
      <a href="/portfolio" data-link>Portfólio <span aria-hidden="true">↗</span></a>
      <a href="/sobre" data-link>Meu olhar <span aria-hidden="true">↗</span></a>
      <a href="/galeria" data-link>Galeria do cliente <span aria-hidden="true">↗</span></a>
      <a href="#contato" data-contact>Vamos conversar <span aria-hidden="true">↗</span></a>
    </nav>
    <p class="menu-foot">A VIDA PASSA. A IMAGEM FICA.<br>Curitiba, Brasil & além.</p>
  </dialog>
  <dialog id="lightbox" class="lightbox" aria-labelledby="lightbox-title">
    <div class="lightbox-top"><span id="lightbox-title"></span><button class="lightbox-close" data-action="close-lightbox" aria-label="Fechar fotografia">×</button></div>
    <div class="lightbox-photo"><img id="lightbox-image" src="/assets/images/vento.webp" alt=""></div>
    <div class="lightbox-bottom">
      <div class="lightbox-controls"><button class="round-button" data-lightbox-step="-1" aria-label="Foto anterior">←</button><button class="round-button" data-lightbox-step="1" aria-label="Próxima foto">→</button><span id="lightbox-count"></span></div>
      <a class="lightbox-download" id="lightbox-download" download>Guardar imagem <span aria-hidden="true">↓</span></a>
    </div>
  </dialog>
  <dialog id="feedback-dialog" class="feedback-dialog" aria-labelledby="feedback-title">
    <div class="feedback-top"><span class="eyebrow">LUME / DEMONSTRAÇÃO</span><button data-action="close-feedback" aria-label="Fechar prévia">×</button></div>
    <div id="feedback-content"></div>
  </dialog>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
